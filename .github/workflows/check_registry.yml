name: Dual Backend Smoke

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
      ROS_DISTRO: jazzy

    steps:
      - uses: actions/checkout@v6
      - name: Checkout the verified Uni-Lab-OS runtime
        uses: actions/checkout@v6
        with:
          repository: deepmodeling/Uni-Lab-OS
          ref: 1a2cfd31d3d48a495b0eb8d09a906df769a3a363
          path: .ci/unilabos
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          use-mamba: true
          python-version: '3.12.13'
          channels: conda-forge,robostack-jazzy
          channel-priority: strict
          activate-environment: unilab
          auto-update-conda: false
      - name: Install ROS2 and build tools
        shell: bash -el {0}
        run: |
          mamba install -n unilab --override-channels -c conda-forge -c robostack-jazzy \
            conda-forge::numpy=2 conda-forge::uv conda-forge::colcon-common-extensions \
            robostack-jazzy::ros2-distro-mutex=0.15 robostack-jazzy::ros-jazzy-ros-core \
            robostack-jazzy::ros-jazzy-action-msgs robostack-jazzy::ros-jazzy-std-msgs \
            robostack-jazzy::ros-jazzy-geometry-msgs robostack-jazzy::ros-jazzy-control-msgs \
            robostack-jazzy::ros-jazzy-nav2-msgs robostack-jazzy::ros-jazzy-moveit-msgs \
            robostack-jazzy::ros-jazzy-tf-transformations robostack-jazzy::ros-jazzy-tf2-ros \
            robostack-jazzy::ros-jazzy-tf2-ros-py conda-forge::transforms3d -y
      - name: Build unilabos_msgs and install runtime
        shell: bash -el {0}
        run: |
          colcon build --base-paths .ci/unilabos/unilabos_msgs \
            --build-base .ci/build/unilabos_msgs \
            --install-base .ci/install/unilabos_msgs \
            --merge-install --packages-select unilabos_msgs \
            --cmake-args -DBUILD_TESTING=OFF
          source .ci/install/unilabos_msgs/setup.bash
          uv pip install -r .ci/unilabos/unilabos/utils/requirements.txt
          uv pip install pywinauto git+https://github.com/Xuwznln/pylabrobot.git
          uv pip install pytest -e .ci/unilabos -e .
      - name: Validate registry and HostLink closed loop
        shell: bash -el {0}
        run: |
          source .ci/install/unilabos_msgs/setup.bash
          unilab --check_mode --skip_env_check --devices ./lan_demo --external_devices_only
          python -m pytest -q tests/test_hostlink_smoke.py -p no:launch_testing -p no:launch_ros
      - name: Validate ROS2 closed loop
        shell: bash -el {0}
        run: |
          source .ci/install/unilabos_msgs/setup.bash
          python -m lan_demo.smoke --backend ros2 --timeout 60
