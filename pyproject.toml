[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lan_demo"
version = "0.2.0"
description = "Uni-Lab-OS LAN 双运行时演示：跨设备 @subscribe + call_device_action 闭环"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["unilabos", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["lan_demo*"]
