[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lan_demo"
version = "0.1.0"
description = "Uni-Lab-OS LAN 演示设备包：跨设备 @subscribe + call_device_action 闭环 (host/slave)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["lan_demo*"]
